name: Selftest on x86-64 and arm64

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

permissions:
  contents: read

env:
  EXPECTED_SELFTEST_SHA256: e0c8ae9167d99b37b00194fb3bdf5d545952ae4fc223e0c2d5be3382708d7444

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The script pins the compiler release by tag and archive digest.
      - name: Build and run the selftest
        run: .github/scripts/selftest-build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-x86_64
          path: out/
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The script pins the compiler release by tag and archive digest.
      - name: Build and run the selftest
        run: .github/scripts/selftest-build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-aarch64
          path: out/
          if-no-files-found: error

  compare:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Require equal output and the expected digest
        shell: bash
        run: |
          set -euo pipefail
          cat art/selftest-x86_64/uname.txt art/selftest-aarch64/uname.txt
          grep -qx 'UNAME_M x86_64'  art/selftest-x86_64/uname.txt
          grep -qx 'UNAME_M aarch64' art/selftest-aarch64/uname.txt
          cmp art/selftest-x86_64/selftest.first.txt art/selftest-aarch64/selftest.first.txt
          cmp art/selftest-x86_64/selftest.second.txt art/selftest-aarch64/selftest.second.txt
          want="SELFTEST_SHA256 ${EXPECTED_SELFTEST_SHA256}"
          [ "$(cat art/selftest-x86_64/selftest_sha256.line)" = "$want" ]
          [ "$(cat art/selftest-aarch64/selftest_sha256.line)" = "$want" ]
          echo "SELFTEST x86_64 == aarch64: ${EXPECTED_SELFTEST_SHA256}"
